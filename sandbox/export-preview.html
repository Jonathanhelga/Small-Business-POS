<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Export styling sandbox</title>
    <style>
        /* Standalone page — deliberately not sharing the app's CSS. Just enough
           to make the controls pleasant while we iterate on the spreadsheet. */
        :root { color-scheme: light; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
        }
        .card {
            width: min(420px, 90vw);
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }
        h1 { font-size: 20px; margin: 0 0 4px; }
        p.sub { margin: 0 0 24px; color: #94a3b8; font-size: 14px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f1f5f9;
            font-size: 15px;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { opacity: 0.6; cursor: default; }
        .hint { margin-top: 16px; font-size: 12px; color: #64748b; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Export styling sandbox</h1>
        <p class="sub">Generate a styled .xlsx from dummy data, open it, refine.</p>

        <label for="currency">Currency (to sanity-check the money mask)</label>
        <select id="currency">
            <option value="IDR">IDR — Rp</option>
            <option value="USD">USD — $</option>
            <option value="EUR">EUR — €</option>
            <option value="JPY">JPY — ¥</option>
            <option value="MYR">MYR — RM</option>
        </select>

        <button id="generate" type="button">Generate styled export</button>

        <p class="hint">
            Downloads a workbook with Summary, Inventory &amp; Orders sheets.
            Open it in Excel / Numbers / Google Sheets to review the styling.
        </p>
    </div>

    <script type="module" src="./export-preview_v3.js"></script>
</body>
</html>
